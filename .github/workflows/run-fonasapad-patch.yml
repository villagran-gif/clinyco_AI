name: Run FONASAPAD patch
on:
  push:
    branches: [feat/fonasapad-conversational-preevaluation]
    paths:
      - '.github/workflows/run-fonasapad-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fonasapad-conversational-preevaluation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/patch_antonia_fonasapad.py
      - run: |
          node --check server.js
          node --check fonasapad-preevaluation.js
          node --check memory/state-schema.js
          node --test fonasapad-preevaluation.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js fonasapad-preevaluation.js memory/state-schema.js fonasapad-preevaluation.test.js
          git commit -m "feat: AntonIA resuelve FONASAPAD y agenda sin derivación automática"
          git push origin feat/fonasapad-conversational-preevaluation
