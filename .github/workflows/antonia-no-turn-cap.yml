name: Antonia no artificial turn cap

on:
  push:
    branches:
      - fix/antonia-no-artificial-turn-cap

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antonia-no-artificial-turn-cap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch-no-turn-cap.py
      - name: Validate
        run: |
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('server.js').read_text(encoding='utf-8')
          assert 'ANTONIA_MAX_BOT_MESSAGES || 0' in s
          assert 'function botMessageLimitReached(count)' in s
          assert 'botMessageLimitReached(state.system.botMessagesSent)' in s
          assert 'botMessageLimitReached(latestState.system.botMessagesSent)' in s
          assert 'state.system.botMessagesSent >= MAX_BOT_MESSAGES' not in s
          assert 'latestState.system.botMessagesSent >= MAX_BOT_MESSAGES' not in s
          print('no artificial cap checks ok')
          PY
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git rm scripts/patch-no-turn-cap.py .github/workflows/antonia-no-turn-cap.yml
          git commit -m 'fix: desactivar límite artificial de turnos de AntonIA'
          git push origin HEAD:fix/antonia-no-artificial-turn-cap
