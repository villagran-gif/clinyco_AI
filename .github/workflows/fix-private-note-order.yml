name: Fix private note order
on:
  push:
    branches: [fix/private-note-after-public-reply]
    paths:
      - scripts/move-private-note-after-send.mjs
      - chatwoot-adapter/private-lead-note.js
      - .github/workflows/fix-private-note-order.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-note-after-public-reply
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/move-private-note-after-send.mjs
      - run: node --test tests/chatwoot-private-lead-note.test.mjs tests/chatwoot-call-guard.test.mjs
      - name: Commit server patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: crear ficha privada después de responder al cliente"
          git push origin HEAD:fix/private-note-after-public-reply
