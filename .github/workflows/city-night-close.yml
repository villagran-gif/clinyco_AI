name: City wording and night close
on:
  push:
    branches: [fix/city-wording-separate-night-close]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/city-wording-separate-night-close
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_city_night_close.py
      - run: |
          node --check server.js
          node --check fonasapad-preevaluation.js
          node --check after-hours.js
          node --test fonasapad-preevaluation.test.js after-hours.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js fonasapad-preevaluation.js after-hours.js after-hours.test.js fonasapad-preevaluation.test.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: separar resumen y cierre nocturno"
            git push origin HEAD:fix/city-wording-separate-night-close
          fi
