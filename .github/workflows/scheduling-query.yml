name: Scheduling query
on:
  push:
    branches: [feat/scheduling-handoff-carolin-v6]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scheduling-handoff-carolin-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_scheduling_query.py
      - run: |
          node --check server.js
          node scripts/check_scheduling_query.mjs
          node --test after-hours.test.js fonasapad-preevaluation.test.js tests/chatwoot-adapter.test.js tests/identity-normalizers.test.js extraction/updateDraftsFromText.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js scripts/check_scheduling_query.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat: búsqueda directa de agenda desde AntonIA"
            git push origin HEAD:feat/scheduling-handoff-carolin-v6
          fi
