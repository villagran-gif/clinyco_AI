name: Location guard specificity
on:
  push:
    branches: [fix/location-guard-specificity]
    paths:
      - '.github/workflows/location-guard-specificity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old='''  return [\n    "DONDE ESTAN UBICADOS",\n    "DONDE ESTAN",\n    "UBICACION",\n    "DIRECCION",\n    "SEDE CERCANA",\n    "SEDE MAS CERCANA",\n    "QUE SEDE",\n    "CUAL SEDE"\n  ].some((phrase) => key.includes(phrase));'''
          new='''  return [\n    "DONDE ESTAN UBICADOS",\n    "DONDE ATIENDEN",\n    "DONDE QUEDA",\n    "UBICACION DE LA CLINICA",\n    "UBICACION DE LA SEDE",\n    "DIRECCION DE LA CLINICA",\n    "DIRECCION DE LA SEDE",\n    "SEDE CERCANA",\n    "SEDE MAS CERCANA",\n    "QUE SEDE",\n    "CUAL SEDE"\n  ].some((phrase) => key.includes(phrase));'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''    key.includes("PUEDES VIAJAR A") ||\n    key.includes("PREFIERES TELECONSULTA") ||\n    key.includes("PREFIERES SAN FELIPE") ||\n    key.includes("PREFIERES LOS ANDES") ||'''
          new2='''    key.includes("PUEDES VIAJAR A") ||\n    key.includes("PODES VIAJAR A") ||\n    key.includes("PREFIERES TELECONSULTA") ||\n    key.includes("PREFERIS TELECONSULTA") ||\n    key.includes("PREFIERES SAN FELIPE") ||\n    key.includes("PREFERIS SAN FELIPE") ||\n    key.includes("PREFIERES LOS ANDES") ||\n    key.includes("PREFERIS LOS ANDES") ||'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          node --check server.js
          grep -q 'DIRECCION DE LA CLINICA' server.js
          grep -q 'PREFERIS TELECONSULTA' server.js
      - name: Commit and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "fix: estrechar detector de sede y cubrir voseo en guardrail"
          git rm .github/workflows/location-guard-specificity.yml
          git commit -m "ci: remove one-shot location guard workflow"
          git push origin HEAD:fix/location-guard-specificity
