name: Antonia human bariatric patch

on:
  push:
    branches:
      - improve/antonia-human-bariatric

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/antonia-human-bariatric
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: python3 scripts/patch-antonia-human-bariatric.py
      - name: Validate syntax and focused behavior
        run: |
          node --check server.js
          node --check extraction/detectProcedure.js
          node --check knowledge/prompt-context.js
          node --test tests/chatwoot-adapter.test.js
          node --input-type=module <<'NODE'
          import { detectProcedure } from './extraction/detectProcedure.js';
          const c = detectProcedure('Me interesa conversion de manga a bypass por reflujo');
          if (!c || c.key !== 'CONVERSION_MANGA_BYPASS') process.exit(1);
          const m = detectProcedure('Quiero informacion de manga gastrica');
          if (!m || m.key !== 'BARIATRICA') process.exit(2);
          NODE
          python3 -m json.tool knowledge/procedures.json >/dev/null
          python3 -m json.tool knowledge/faq_medical_safe.json >/dev/null
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git rm scripts/patch-antonia-human-bariatric.py .github/workflows/antonia-human-bariatric.yml
          git commit -m 'feat: Antonia mas humana y experta en manga bypass conversion'
          git push origin HEAD:improve/antonia-human-bariatric
