name: Validate Antonia Intent

on:
  push:
    branches:
      - codex/antonia-multimodal-intent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check conversation-resolver.js
      - run: node --test tests/conversation-resolver.test.js tests/chatwoot-adapter.test.js tests/identity-normalizers.test.js
