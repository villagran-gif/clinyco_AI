name: One-time Zendesk runtime removal

on:
  push:
    branches:
      - codex/remove-zendesk-runtime

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic refactor
        run: node scripts/refactor-remove-zendesk.mjs

      - name: Validate syntax
        run: |
          node --check server.js
          node --check eugenia/runtime.js
          node --check eugenia/index.js

      - name: Validate Chatwoot adapter
        run: node --test tests/chatwoot-adapter.test.js

      - name: Verify removed runtime endpoints
        run: |
          ! grep -nE 'api\.getbase\.com|\.zendesk\.com|SUNCO_|app\.post\("/messages"|/ticket-assigned|/ticket-updated|/support-search-test' server.js

      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: retirar Zendesk y Sunshine del core"
          git push origin HEAD:codex/remove-zendesk-runtime
