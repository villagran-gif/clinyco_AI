name: Antonia two bubbles human chat

on:
  push:
    branches:
      - fix/antonia-two-bubbles-human-chat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antonia-two-bubbles-human-chat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply patch
        run: python3 scripts/patch-antonia-two-bubbles.py
      - name: Validate syntax and focused behavior
        run: |
          node --check server.js
          node --check conversation-resolver.js
          npm test
          python3 - <<'PY'
          from pathlib import Path
          s = Path('server.js').read_text()
          r = Path('conversation-resolver.js').read_text()
          checks = [
              'splitAntoniaReplyBubbles',
              '[[MSG]]',
              'hola soy Antonia[[MSG]]',
              'await sleep(300 + Math.floor(Math.random() * 450))',
              'tu problema ahora es reflujo\\no reganancia\\no ambos?',
          ]
          for item in checks:
              assert item in s, item
          assert 'claro[[MSG]]con qué profesional buscas hora?' in r
          assert 'tu previsión es Fonasa Isapre o Particular?' in r
          assert 'cuánto pesas?' in r
          assert 'y cuánto mides?' in r
          print('focused checks ok')
          PY
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js conversation-resolver.js
          git rm scripts/patch-antonia-two-bubbles.py .github/workflows/antonia-two-bubbles.yml
          git commit -m 'ux: AntonIA conversa en dos burbujas cortas'
          git push origin HEAD:fix/antonia-two-bubbles-human-chat
