name: Antonia short resolver copy

on:
  push:
    branches:
      - fix/antonia-short-resolver-copy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antonia-short-resolver-copy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply copy patch
        run: python3 scripts/patch-short-resolver-copy.py
      - name: Validate
        run: |
          node --check server.js
          node --check conversation-resolver.js
          node --test tests/chatwoot-adapter.test.js
      - name: Commit and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js conversation-resolver.js
          git rm scripts/patch-short-resolver-copy.py .github/workflows/antonia-short-resolver-copy.yml
          git commit -m 'ux: acortar preguntas deterministicas de Antonia'
          git push origin HEAD:fix/antonia-short-resolver-copy
