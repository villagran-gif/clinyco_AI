name: Full DB history rehydration
on:
  push:
    branches:
      - fix/full-db-history-rehydration-2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-db-history-rehydration-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/patch_full_db_history.py
      - name: Validate syntax and focused tests
        run: |
          node --check db.js
          node --check server.js
          node --check fonasapad-preevaluation.js
          node --test fonasapad-preevaluation.test.js tests/chatwoot-adapter.test.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db.js server.js fonasapad-preevaluation.js fonasapad-preevaluation.test.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: rehidratar AntonIA desde historial completo de Chatwoot"
          git push origin HEAD:fix/full-db-history-rehydration-2
