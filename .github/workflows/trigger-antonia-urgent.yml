name: Trigger AntonIA urgent guardrails
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-antonia-urgent.yml'
permissions:
  actions: write
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/antonia-urgent-guardrails.yml/dispatches \
            -d '{"ref":"main"}'
