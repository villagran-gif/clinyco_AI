name: Cleanup schedule flags
on:
  push:
    branches: [feat/scheduling-handoff-carolin-v6]
    paths: [scripts/trigger_cleanup_flags.txt]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scheduling-handoff-carolin-v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/cleanup_schedule_flags.py
      - run: |
          node --check server.js
          node --test after-hours.test.js fonasapad-preevaluation.test.js tests/chatwoot-adapter.test.js tests/identity-normalizers.test.js extraction/updateDraftsFromText.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "fix: retirar flags duplicados de agenda"
          git push origin HEAD:feat/scheduling-handoff-carolin-v6
