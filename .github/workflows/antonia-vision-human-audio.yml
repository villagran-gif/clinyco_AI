name: Refactor Antonia vision human audio

on:
  push:
    branches:
      - feature/antonia-vision-human-audio

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/antonia-vision-human-audio
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic refactor
        run: python3 .github/scripts/refactor_antonia_vision.py

      - name: Validate syntax and focused tests
        run: |
          node --check server.js
          node --check chatwoot-adapter/parse.js
          node --check chatwoot-adapter/client.js
          node --test tests/chatwoot-adapter.test.js

      - name: Commit refactor and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/antonia-vision-human-audio.yml
          rm -f .github/scripts/refactor_antonia_vision.py
          git add server.js chatwoot-adapter/parse.js chatwoot-adapter/client.js tests/chatwoot-adapter.test.js .github/workflows/antonia-vision-human-audio.yml .github/scripts/refactor_antonia_vision.py
          git commit -m "feat: visión, respuestas humanas y audio opt-in para Antonia"
          git push origin HEAD:feature/antonia-vision-human-audio
