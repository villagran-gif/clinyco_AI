on:
  push:
    branches:
      - feature/antonia-vision-human-audio

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/antonia-vision-human-audio
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic refactor
        run: |
          python3 <<'PY'
