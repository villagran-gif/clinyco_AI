name: Night close four bubbles
on:
  push:
    branches:
      - fix/night-close-four-bubbles
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/night-close-four-bubbles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/patch_night_close_four_bubbles.py
      - run: |
          node --check server.js
          node --check after-hours.js
          node --test after-hours.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add after-hours.js server.js after-hours.test.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: cierre nocturno en cuatro burbujas"
            git push origin HEAD:fix/night-close-four-bubbles
          fi
