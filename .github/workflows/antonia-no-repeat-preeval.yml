name: AntonIA no repeat preevaluation
on:
  push:
    branches: [fix/antonia-no-repeat-preevaluation]
    paths:
      - '.github/workflows/antonia-no-repeat-preeval.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/antonia-no-repeat-preevaluation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sed -i 's/makeState(/state(/g' scripts/patch_no_repeat_preeval.py
      - run: python3 scripts/patch_no_repeat_preeval.py
      - name: Fix test variable names
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('fonasapad-preevaluation.test.js')
          s=p.read_text()
          marker='test("rehidrata manga 2012 y motivo ya respondidos antes de un deploy"'
          i=s.index(marker)
          head=s[:i]
          tail=s[i:]
          tail=tail.replace('const state = state(', 'const s = state(')
          tail=tail.replace('state.measurements', 's.measurements')
          tail=tail.replace('state.contactDraft', 's.contactDraft')
          tail=tail.replace('state.preevaluation', 's.preevaluation')
          tail=tail.replace('hydrateFonasaPadPreevaluationFromHistory(state,', 'hydrateFonasaPadPreevaluationFromHistory(s,')
          tail=tail.replace('nextFonasaPadPreevaluationStep(state,', 'nextFonasaPadPreevaluationStep(s,')
          tail=tail.replace('applyFonasaPadPreevaluationAnswer(state,', 'applyFonasaPadPreevaluationAnswer(s,')
          p.write_text(head+tail)
          PY
      - run: |
          node --check server.js
          node --check fonasapad-preevaluation.js
          node --check memory/state-schema.js
          node --test fonasapad-preevaluation.test.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js fonasapad-preevaluation.js fonasapad-preevaluation.test.js memory/state-schema.js
          git commit -m "fix: rehidratar preevaluación y no repetir preguntas"
          git rm -f .github/workflows/antonia-no-repeat-preeval.yml scripts/patch_no_repeat_preeval.py
          git commit -m "chore: retirar parche temporal anti-repetición"
          git push origin fix/antonia-no-repeat-preevaluation
